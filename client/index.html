<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ContentFlow - Next-Generation Dynamic Content Management System" />
    <title>ContentFlow | Dynamic CMS</title>
    <style>
      /* Prevent initial white flash before CSS bundles execute */
      html, body, #root {
        background-color: #070908 !important;
        color: #f1f4f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* Concept 03 Pre-Boot Offline Fallback (Renders even if JS bundle fails to load offline) */
      @keyframes prebootPulse {
        0% { transform: scale(0.2); opacity: 0.85; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      @keyframes prebootCore {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.22); opacity: 0.85; }
      }
      #offline-preboot-screen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #070908;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }
      .offline-ring {
        position: absolute;
        inset: 0;
        margin: auto;
        border-radius: 9999px;
        border: 1px solid #A6EE38;
        box-shadow: 0 0 24px rgba(166, 238, 56, 0.4);
        animation: prebootPulse 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
    </style>
    <script>
      // Immediate pre-boot check before JS execution
      if (!navigator.onLine) {
        document.addEventListener('DOMContentLoaded', function () {
          var screen = document.getElementById('offline-preboot-screen');
          if (screen) screen.style.display = 'flex';
        });
      }
      window.addEventListener('online', function () {
        var screen = document.getElementById('offline-preboot-screen');
        if (screen) screen.style.display = 'none';
      });
      window.addEventListener('offline', function () {
        var screen = document.getElementById('offline-preboot-screen');
        if (screen) screen.style.display = 'flex';
      });
    </script>
    <!-- Google Fonts for Editorial Typography (Space Grotesk, Syne, Cabinet/Clash, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-obsidian-950 text-obsidian-100 antialiased selection:bg-emperor-500 selection:text-obsidian-950 min-h-screen">
    <!-- Concept 03 Pre-Boot Screen (Guaranteed to work if user opens site while offline) -->
    <div id="offline-preboot-screen">
      <div style="position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center;">
        <div class="offline-ring" style="animation-delay: 0s;"></div>
        <div class="offline-ring" style="animation-delay: 0.8s;"></div>
        <div class="offline-ring" style="animation-delay: 1.6s;"></div>
        <div style="position: relative; width: 16px; height: 16px; border-radius: 9999px; background-color: #F4C52E; box-shadow: 0 0 20px #F4C52E; animation: prebootCore 1.2s ease-in-out infinite;"></div>
      </div>
      <div style="margin-top: 36px; text-align: center; letter-spacing: 0.35em;">
        <div style="color: #A6EE38; font-size: 13px; font-weight: 700; text-transform: uppercase;">Slow Connection</div>
        <div style="color: #8B95AC; font-size: 11px; margin-top: 10px; text-transform: uppercase;">Waiting for network...</div>
        <div style="color: #F4C52E; font-size: 11px; margin-top: 8px; font-weight: 600; text-transform: uppercase;">● Reconnecting</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
